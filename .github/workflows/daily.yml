name: Daily forecast

on:
  # GitHub 排程在整點尖峰常延遲或被略過，所以避開整點並設三個時段；
  # 當天的報已經在網站上時，後面的時段會自動略過。
  schedule:
    - cron: "23 9 * * *"       # 台北 17:23
    - cron: "47 10 * * *"      # 台北 18:47 (備援)
    - cron: "13 12 * * *"      # 台北 20:13 (備援，在本機 21:00 下載之前)
  workflow_dispatch:
    inputs:
      dates:
        description: "初始日期 (00Z)：空白 = 今天；單日 20261101；區間 20261101-20261111；或用逗號分隔"
        required: false

permissions:
  contents: write    # 推送 gh-pages、建立 Releases
  actions: write     # 防止排程因 60 天無活動被停用

env:
  END_DATE: "20270114"   # 實驗結束日：之後排程不再執行
  KEEP_FULL: "7"         # 最近 7 天保留完整內容
  KEEP_LITE: "365"       # 更早的一律保留精簡版 (比較圖 + 探空)
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: forecast-site
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      dates: ${{ steps.d.outputs.dates }}
      go: ${{ steps.d.outputs.go }}
    steps:
      - id: d
        name: 決定要處理的日期
        run: |
          IN="${{ github.event.inputs.dates }}"
          TODAY=$(date -u +%Y%m%d)
          if [ -z "$IN" ]; then
            LIST="$TODAY"
          elif [[ "$IN" == *-* ]]; then
            A=${IN%-*}; B=${IN#*-}; LIST=""
            d=$A; while [ "$d" -le "$B" ]; do LIST="$LIST $d"; d=$(date -u -d "$d +1 day" +%Y%m%d); done
          else
            LIST=$(echo "$IN" | tr ',' ' ')
          fi
          GO=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$TODAY" -gt "$END_DATE" ]; then
              GO=false; echo "實驗已於 $END_DATE 結束，不再自動執行"
            elif gh api "repos/${{ github.repository }}/contents/runs/${TODAY}00/manifest.json?ref=gh-pages" > /dev/null 2>&1; then
              GO=false; echo "${TODAY}00 已在網站上，這個備援時段略過"
            fi
          fi
          JSON=$(printf '%s\n' $LIST | jq -R . | jq -cs .)
          echo "dates=$JSON" >> "$GITHUB_OUTPUT"
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "日期: $JSON  執行: $GO"

      - name: 防止排程被停用 (60 天無活動)
        if: github.event_name == 'schedule' && steps.d.outputs.go == 'true'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"

  make:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        date: ${{ fromJSON(needs.plan.outputs.dates) }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      DATE: ${{ matrix.date }}
    steps:
      - uses: actions/checkout@v5

      - name: 等待 ECMWF 資料上線 (最多 3 小時)
        run: |
          URL="https://storage.googleapis.com/ecmwf-open-data/${DATE}/00z/ifs/0p1/oper/${DATE}000000-120h-oper-fc-pl.index"
          ok=0
          for i in $(seq 1 36); do
            if curl -sfI "$URL" > /dev/null; then ok=1; break; fi
            echo "第 $i 次檢查：尚未上線，5 分鐘後再試"; sleep 300
          done
          if [ "$ok" = 1 ]; then echo "資料已上線"; else echo "等了 3 小時資料仍未上線"; false; fi

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: 安裝字型
        run: sudo apt-get install -y -q fonts-liberation && rm -rf ~/.cache/matplotlib

      - name: 海岸線資料快取
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-v1

      - name: 下載預報資料
        run: |
          python download_ecmwf.py "$DATE"
          python download_sounding.py "$DATE"

      - name: 繪製天氣圖與探空
        run: |
          python plot_ecmwf.py "$DATE"
          python plot_sounding.py "$DATE"

      - name: 逐 run 比較
        run: python compare_runs.py "$DATE"

      - name: 轉成網站格式
        run: python build_site.py "$DATE" --run-only

      - name: 完整封存到 Releases (永久保存，不佔網站容量)
        run: |
          RUN="${DATE}00"; TAG="run-${RUN}"; Z="ECMWF_IFS_${RUN}_full.zip"
          (cd site/runs && zip -qr "../../$Z" "$RUN")
          ls -lh "$Z"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$Z" --clobber
          else
            gh release create "$TAG" "$Z" --title "ECMWF IFS 0.1° ${RUN:0:4}-${RUN:4:2}-${RUN:6:2} 00Z" \
              --notes "完整封存：動畫 (風羽、流線)、逐 run 比較、探空圖與 .edt.txt。解壓後的資料夾可放回網站的 runs/ 底下。" \
              --target main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: run-${{ matrix.date }}
          path: site/runs/
          retention-days: 3

  publish:
    needs: [plan, make]
    if: always() && needs.plan.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 取出目前的網站內容
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site

      - name: 收集這次產生的各報
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: run-*
          path: new-runs
          merge-multiple: true

      - name: 以新產生的報取代網站上同一報 (不留舊檔)
        run: |
          mkdir -p site/runs new-runs
          for d in new-runs/*/; do
            [ -d "$d" ] || continue
            r=$(basename "$d"); rm -rf "site/runs/$r"; mv "$d" "site/runs/$r"; echo "更新 $r"
          done

      - name: 套用保留規則並重建網頁
        run: |
          python3 build_site.py
          du -sh site/runs/* | tail -20
          echo "網站總大小: $(du -sh --exclude=.git site | cut -f1)"

      - name: 發佈到 gh-pages (只保留最新一份，不留歷史)
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish
          git add -A
          git commit -q -m "Forecast site $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin publish:gh-pages

      - name: 有報失敗時讓整個流程標示為失敗 (會寄通知信)
        if: needs.make.result != 'success'
        run: echo "部分日期產圖失敗，請到 Actions 查看" && false
